      S.diag = { status: "ready", items: result.items, answers: [], index: 0 };
    } catch (e) {
      if (run !== S.run) return;
      S.diag = { status: "error", error: friendly(e), items: [], answers: [], index: 0 };
    }
    if (S.view === "check") { S.focusPending = true; render(); }
  }

  function answerDiagnostic(choice) {
    const d = S.diag;
    if (!d || d.status !== "ready" || d.answers[d.index]) return;
    const item = d.items[d.index];
    const unsure = choice === -1;
    const correct = !unsure && choice === item.correct_index;
    d.answers[d.index] = { choice, correct, unsure };
    recordDiagnostics();
    if (!correct) loadBridge(item.pi, false); // start writing the bridge right away
    render();
    announceFeedback();
  }

  // Log answers as they come in, so an abandoned session still has its per-item results.
  function recordDiagnostics() {
    const d = S.diag;
    const s = S.session;
    s.diagnostics = d.items.map((it, i) => (d.answers[i] ? {
      term: it.term, type: it.type, why_needed: it.why_needed, correct: !!d.answers[i].correct, unsure: !!d.answers[i].unsure,
    } : null)).filter(Boolean);
    s.diagnostics_missed = s.diagnostics.filter((x) => !x.correct).length;
    s.prerequisite_pre_post = s.diagnostics.map((d) => ({ term: d.term, type: d.type, pre: d.correct, pre_unsure: d.unsure, post: null, post_unsure: null, post_status: d.correct ? "not_needed" : "pending" }));
    saveSession();
  }

  function finishDiagnostic() {
    const d = S.diag;
    const s = S.session;
    recordDiagnostics();
    // Missed prerequisites go on the spaced-review list now, even if the mini-check later fails or is skipped.
    const missedQ = d.items.filter((_, i) => !(d.answers[i] && d.answers[i].correct));
    const sched = missedQ.length ? scheduleReviews(missedQ.map((it) => ({ kind: "prerequisite", term: it.term, question: it.question, options: it.options, correct_index: it.correct_index, explanation: it.explanation }))) : null;
    s.reviews_scheduled = sched ? sched.added : 0;
    S.reviewDates = sched ? sched.due_dates : null;
    s.bridged_terms = s.diagnostics.filter((x) => !x.correct).map((x) => x.term);
    S.bridgeSkipped = s.diagnostics_missed === 0;
    s.bridge_skipped = S.bridgeSkipped;
    s.recheck_status = S.bridgeSkipped ? "skipped_all_correct" : "not_started";
    saveSession();
    if (S.bridgeSkipped) {
      S.openTerm = null;
      go("reread");
    } else {
      const first = missedItems()[0];
      S.openTerm = first ? first.pi : null;
      go("bridge");
    }
  }

  const missedItems = () => (S.diag && S.diag.status === "ready" ? S.diag.items.filter((_, i) => S.diag.answers[i] && !S.diag.answers[i].correct) : []);
  const isBridged = (pi) => missedItems().some((it) => it.pi === pi);

  async function startRecheck() {
    if (S.bridgeSkipped) { go("reread"); return; }
    const run = S.run, targets = missedItems();
    S.recheck = { status: "loading", items: [], answers: [], index: 0 };
    S.session.recheck_status = "in_progress";
    saveSession();
    go("recheck");
    try {
      const canned = S.isDemo ? { kind: "immediate_recheck", items: clone(demoData().recheck.items.filter((q) => targets.some((t) => t.term === q.term))) } : undefined;
      const result = await generateJSON("makeRecheck", Object.assign({
        prompt: promptRecheck({ passage: S.passage, courseLabel: course().label, targets, homework: homework() }),
        schema: SCHEMA.recheck, validate: (v) => validateRecheck(v, targets), canned,
      }, runOpts()));
      if (run !== S.run) return;
      S.recheck = { status: "ready", items: result.items, answers: [], index: 0 };
    } catch (e) {
      if (run !== S.run) return;
      S.recheck = { status: "skipped" };
      S.session.recheck_status = "recheck_unavailable";
      for (const pair of S.session.prerequisite_pre_post) {
        if (targets.some((t) => t.term === pair.term)) {
          pair.post = null; pair.post_unsure = null; pair.post_status = "recheck_unavailable";
        }
      }
      saveSession();
      // Recheck failure must never prevent a student finishing the reading loop.
      if (S.view === "recheck") { go("reread"); return; }
      if (S.lastStudentView === "recheck") S.lastStudentView = "reread";
      render();
    }
    if (S.view === "recheck") { S.focusPending = true; render(); }
  }

  function answerRecheck(choice) {
    const r = S.recheck;
    if (!r || r.status !== "ready" || r.answers[r.index]) return;
    const q = r.items[r.index];
    r.answers[r.index] = { choice, correct: choice !== -1 && choice === q.correct_index, unsure: choice === -1 };
    S.session.recheck = r.items.flatMap((it, i) => r.answers[i] ? [{ term: it.term, type: it.type, correct: r.answers[i].correct, unsure: r.answers[i].unsure }] : []);
    for (const pair of S.session.prerequisite_pre_post) {
      const post = S.session.recheck.find((a) => a.term === pair.term);
      if (post) { pair.post = post.correct; pair.post_unsure = post.unsure; pair.post_status = "answered"; }
    }
    if (r.answers.filter(Boolean).length === r.items.length) S.session.recheck_status = "completed";
    saveSession(); render(); announceFeedback();
  }

  async function loadBridge(pi, onDemand) {
    const p = prereqs()[pi];
    if (!p) return;
    const existing = S.bridges[pi];
    if (existing && (existing.status === "loading" || existing.status === "ready")) return;
    const run = S.run;
    S.bridges[pi] = { status: "loading" };
    if (onDemand && S.session && !S.session.on_demand_bridges.includes(p.term)) { S.session.on_demand_bridges.push(p.term); saveSession(); }
    render();
    try {
      const L = lang();
      let canned;
      if (S.isDemo && demoBridge(p.term)) {
        const b = demoBridge(p.term);
        canned = { term: p.term, intuition: b.intuition, definition: b.definition, example: b.example, gloss: L.id === "en" ? "" : b.gloss[L.id] || "" };
      }
      const data = await generateJSON("makeBridge", Object.assign({
        prompt: promptBridge({ passage: S.passage, courseLabel: course().label, prereq: p, lang: L, homework: homework() }),
        validate: (v, lenient) => validateBridge(v, L, lenient),
        schema: SCHEMA.bridge,
        canned,
      }, runOpts()));
      if (run !== S.run) return;
      S.bridges[pi] = { status: "ready", data };
    } catch (e) {
      if (run !== S.run) return;
      S.bridges[pi] = { status: "error", error: friendly(e) };
    }
    if (["bridge", "reread"].includes(S.view)) render();
  }

  async function loadMiniCheck() {
    const run = S.run;
    if (S.mini && (S.mini.status === "loading" || S.mini.status === "ready")) return;
    S.mini = { status: "loading", questions: [], answers: [], index: 0, finished: false };
    try {
      const saved = S.isDemo ? null : (passageCache()[passageKey()] || {}).mini;
      const report = {};
      const result = await generateJSON("makeMiniCheck", Object.assign({ report,
        prompt: promptMiniCheck({ passage: S.passage, courseLabel: course().label, homework: homework() }),
        validate: (v, lenient) => validateMiniCheck(v, lenient),
        schema: SCHEMA.minicheck,
        canned: S.isDemo ? clone(demoData().minicheck) : saved ? clone(saved) : undefined,
      }, runOpts()));
      if (run !== S.run) return;
      if (!S.isDemo && !saved && report.strict) rememberPassage(passageKey(), "mini", { questions: result.questions.map((q) => Object.assign({ answer_text: q.options[q.correct_index] }, q)) });
      S.mini = { status: "ready", questions: result.questions, answers: [], index: 0, finished: false };
    } catch (e) {
      if (run !== S.run) return;
      S.mini = { status: "error", error: friendly(e), questions: [], answers: [], index: 0, finished: false };
    }
    if (S.view === "practice") { S.focusPending = true; render(); }
  }

  function answerMini(choice) {
    const m = S.mini;
    if (!m || m.status !== "ready" || m.answers[m.index]) return;
    const q = m.questions[m.index];
    m.answers[m.index] = { choice, correct: choice === q.correct_index };
    render();
    announceFeedback();
  }

  function finishMini() {
    const m = S.mini;
    m.finished = true;
    const s = S.session;
    s.minicheck = m.questions.map((q, i) => ({ difficulty: q.difficulty, correct: !!(m.answers[i] && m.answers[i].correct) }));
    s.minicheck_score = s.minicheck.filter((x) => x.correct).length;
    s.minicheck_total = m.questions.length;
    const toReview = [];
    m.questions.forEach((q, i) => {
      if (!(m.answers[i] && m.answers[i].correct)) toReview.push({ kind: "mini-check", question: q.question, options: q.options, correct_index: q.correct_index, explanation: q.explanation });
    });
    const sched = toReview.length ? scheduleReviews(toReview) : null;
    s.reviews_scheduled = (s.reviews_scheduled || 0) + (sched ? sched.added : 0);
    m.reviewCount = s.reviews_scheduled;
    m.reviewDates = (sched && sched.due_dates) || S.reviewDates;
    saveSession();
    S.focusPending = true;
    render();
  }

  function submitSurvey(skipped) {
    const s = S.session;
    s.survey = skipped
      ? { skipped: true, helpful: null, found_new: null, still_confusing: "" }
      : { skipped: false, helpful: S.survey.helpful, found_new: S.survey.found_new, still_confusing: clean(S.survey.text, 1000) };
    s.time_spent_sec = Math.max(0, Math.round((Date.now() - S.startedReal) / 1000));
    s.completed = true;
    s.completed_at = iso(now());
    saveSession();
    go("done");
  }

  // ---------- Highlighting the passage ----------
  const isWordChar = (ch) => !!ch && /[\p{L}\p{N}]/u.test(ch);
  function candidatesFor(p) {
    const c = [];
    const add = (x) => { const t = (x || "").trim(); if (t && !c.includes(t)) c.push(t); };
    add(p.anchor);
    add(p.term);
    const noParen = p.term.replace(/\s*\(.*?\)\s*/g, " ").trim();
    add(noParen);
    const paren = p.term.match(/\(([^)]+)\)/);
    if (paren) add(paren[1]);
    if (/s$/i.test(noParen)) add(noParen.slice(0, -1)); else add(noParen + "s");
    for (const tok of p.term.split(/\s+/)) if (tok && !/[a-z]{2,}/i.test(tok)) add(tok); // symbols like Σ or ‖u‖
    return c;
  }
  function findRanges(text, list) {
    const lower = text.toLowerCase();
    const hay = lower.length === text.length ? lower : text;
    const fold = (x) => (hay === lower ? x.toLowerCase() : x);
    const ranges = [];
    const inText = new Set();
    for (const p of list) {
      for (const cand of candidatesFor(p)) {
        const needle = fold(cand);
        let from = 0, found = 0;
        while (found < 6) {
          const at = hay.indexOf(needle, from);
          if (at === -1) break;
          const end = at + needle.length;
          from = at + 1;
          if (isWordChar(cand[0]) && isWordChar(text[at - 1])) continue;
          if (isWordChar(cand[cand.length - 1]) && isWordChar(text[end])) continue;
          if (ranges.some((r) => at < r.end && end > r.start)) continue;
          ranges.push({ start: at, end, pi: p.pi });
          found++;
          from = end;
        }
        if (found) { inText.add(p.pi); break; }
      }
    }
    ranges.sort((a, b) => a.start - b.start);
    return { ranges, inText };
  }
  function highlightedPassage() {
    const order = prereqs().slice().sort((a, b) => (isBridged(b.pi) - isBridged(a.pi)) || (b.importance - a.importance));
    const { ranges, inText } = findRanges(S.passage, order);
    let html = "", pos = 0;
    for (const r of ranges) {
      const p = prereqs()[r.pi];
      html += esc(S.passage.slice(pos, r.start));
      const cls = ["mark", p.type, isBridged(r.pi) ? "bridged" : "", S.openTerm === r.pi ? "is-open" : ""].join(" ");
      html += `<button type="button" class="${cls}" data-action="openTerm" data-pi="${r.pi}" aria-expanded="${S.openTerm === r.pi}" aria-controls="termPanel">${esc(S.passage.slice(r.start, r.end))}<span class="vh"> (${esc(p.term)}${isBridged(r.pi) ? ", you just learned this" : ""})</span></button>`;
      pos = r.end;
    }
    html += esc(S.passage.slice(pos));
    return { html, inText };
  }

  // ---------- Views ----------
  const VIEWS = {};
  const typeLabel = (t) => (t === "language" ? "language" : "concept");
  const impDots = (n) => `<span class="imp" role="img" aria-label="Importance ${n} of 5">${[1, 2, 3, 4, 5].map((k) => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</span>`;
  const loadingView = (eyebrow, line) => `<section class="loading"><p class="eyebrow">${esc(eyebrow)}</p><h2 tabindex="-1" data-focus>${esc(line)}</h2><div class="loading-line"><span class="spinner" aria-hidden="true"></span><span>${S.isDemo ? "Loading the saved demo…" : "Asking the AI. This usually takes 10 to 30 seconds."}</span></div><div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div></section>`;
  const errorBox = (msg, retryAction, extra = "") => `<div class="callout bad" role="alert"><strong>That didn't work.</strong><p>${esc(msg)}</p><div class="actions">${retryAction ? `<button type="button" class="btn primary small" data-action="${retryAction}" data-autofocus>Try again</button>` : ""}${extra}<button type="button" class="btn secondary small" data-action="demoFallback">Try saved demo instead</button></div></div>`;
  const homeworkNote = () => (homework() ? `<div class="callout warn"><strong>This looks like a homework problem.</strong><p>Bridge explains the background ideas and gives hints. It won't give you the final answer, so the thinking stays yours.</p></div>` : "");
  const glossFor = (data) => (lang().id !== "en" && S.showGloss && data && data.gloss ? `<p class="gloss" lang="${lang().tag}"><span class="gloss-label">${esc(lang().label)}</span><span>${esc(data.gloss)}</span></p>${speakButton(data.gloss, lang().id === "zh" ? "zh-CN" : "es-ES", "Read gloss aloud")}` : "");
  const glossToggle = () => (lang().id === "en" ? "" : `<label class="toggle"><input type="checkbox" id="glossToggle" data-change="gloss" ${S.showGloss ? "checked" : ""}> Show ${esc(lang().label)} glosses</label>${S.isDemo ? '<p class="small muted">Saved glosses: not yet reviewed by a native-speaking teacher.</p>' : ""}`);

  VIEWS.home = () => {
    const due = dueReviews();
    const upcoming = due.length ? null : nextUpcoming();
    const reviewBlock = due.length
      ? `<section class="review-card" aria-labelledby="reviewDueTitle"><h2 id="reviewDueTitle" class="h3like" style="font-size:1.25rem">Review due: ${due.length} ${due.length === 1 ? "question" : "questions"}</h2>
          <p class="small">Spaced review brings back what you missed, 1, 3 and 7 days later. It takes about a minute.</p>
          <ul class="small">${due.slice(0, 4).map((r) => `<li>${esc(r.kind === "prerequisite" ? `Background: ${r.term}` : passageLabel(r.question))} <span class="muted">· ${esc(courseById(r.course).label)} · ${REVIEW_DAYS[r.stage] || 7}-day review</span></li>`).join("")}${due.length > 4 ? `<li class="muted">and ${due.length - 4} more</li>` : ""}</ul>
          <div class="actions"><button type="button" class="btn primary small" data-action="startReview">Start review</button></div></section>`
      : upcoming ? `<p class="small muted">Next spaced review: ${esc(fmtDate(upcoming.due_at))}.</p>` : "";
    const cOpts = COURSES.map((c) => `<option value="${c.id}" ${c.id === S.courseId ? "selected" : ""}>${esc(c.label)}</option>`).join("");
    const lOpts = LANGS.map((l) => `<option value="${l.id}" ${l.id === S.langId ? "selected" : ""}>${esc(l.label)}</option>`).join("");
    const heroLang = LANGS.map((l) => `<input type="radio" name="heroLang" id="heroLang-${l.id}" value="${l.id}" data-change="lang" ${l.id === S.langId ? "checked" : ""}><label for="heroLang-${l.id}" lang="${l.tag}">${esc(l.label)}</label>`).join("");
    const g = DEMO.bridges["dot product"];
    return `
      <section class="hero" aria-labelledby="homeTitle">
        <div class="hero-sky" aria-hidden="true"></div>
        <div class="hero-inner">
          <div class="hero-copy">
            <h1 id="homeTitle" tabindex="-1" data-focus>Find what your reading assumes.</h1>
            <p class="lede">Intro STEM texts take background ideas and academic words for granted. Bridge finds them, checks which ones you really have, and teaches only the missing pieces, right before you need them.</p>
            <fieldset class="seg hero-lang"><legend class="small">Glosses in your home language</legend>${heroLang}</fieldset>
            <div class="field"><label class="field-label" for="demoSelect">Choose an offline demo</label><select id="demoSelect" data-change="demo">${DEMOS.map((d) => `<option value="${d.id}" ${d.id === S.demoId ? "selected" : ""}>${esc(d.title)}</option>`).join("")}</select></div>
            <div class="actions">
              <button type="button" class="btn primary" data-action="demo">Try the demo</button>
              <button type="button" class="btn secondary" data-action="focusPassage">Use my own passage</button>
            </div>
            <p class="hero-note">No sign-up. All four demos run with saved content, even without live AI.</p>
          </div>
          <figure class="hero-demo" data-ui role="img" aria-label="Example: in a linear algebra passage, Bridge highlights v · u and explains the dot product, with a Chinese gloss.">
            <div class="hd-top" aria-hidden="true"><b>Orthogonal projection</b><span>Intro linear algebra</span></div>
            <p class="hd-passage" aria-hidden="true">The orthogonal projection of v onto u is proj<sub>u</sub>(v) = ((<span class="mark bridged">v · u</span>) / <span class="mark">‖u‖²</span>) u, and the residual is <span class="mark">orthogonal</span> to u.</p>
            <div class="hd-pop" aria-hidden="true">
              <p><span class="tag">concept</span></p>
              <h3>Dot product</h3>
              <p>${esc(g.intuition)}</p>
              <p class="gloss" lang="zh-Hans"><span class="gloss-label">中文</span><span>${esc(g.gloss.zh)}</span></p>
            </div>
            <div class="hd-chips" aria-hidden="true">${DEMO.gaps.prerequisites.map((p) => `<span class="${p.type}">${esc(p.term)}</span>`).join("")}</div>
          </figure>
        </div>
      </section>
      <div class="home-grid">
        <div class="home-main">
          ${sessionOpen() ? `<div class="callout info"><strong>You have a session in progress.</strong><p class="small">${esc(S.session.passage_label)}</p><div class="actions"><button type="button" class="btn primary small" data-action="studentMode">Continue where you left off</button></div></div>` : ""}
          ${reviewBlock}
          <form id="inputForm" class="panel" novalidate aria-labelledby="ownTitle">
            <h2 id="ownTitle">Bring your own passage</h2>
            <label class="field-label vh" for="passageInput">Passage</label>
            <textarea id="passageInput" rows="8" placeholder="Paste one paragraph or problem from your notes, textbook or homework (up to about 600 words)…">${esc(S.draft)}</textarea>
            <p class="counter${S.draft.length > MAX_PASSAGE ? " over" : ""}" id="charCount">${S.draft.length.toLocaleString()} / ${MAX_PASSAGE.toLocaleString()}</p>
            <p class="notice">${ICON.lock}<span>Don't paste personal information.</span></p>
            <div class="field-row">
              <div class="field"><label class="field-label" for="courseSelect">Course</label><select id="courseSelect" data-change="course">${cOpts}</select></div>
              <div class="field"><label class="field-label" for="langSelect">Home language (optional)</label><select id="langSelect" data-change="lang">${lOpts}</select></div>
            </div>
            ${S.homeError ? `<div class="callout bad" role="alert"><p>${esc(S.homeError)}</p>${aiStatus().mode === "none" ? `<div class="actions"><button type="button" class="btn secondary small" data-action="settings">Open Settings</button><button type="button" class="btn ghost small" data-action="demo">Try demo instead</button></div>` : ""}</div>` : ""}
            <div class="actions">
              <button class="btn primary" type="submit">Find what it assumes</button>
              <button type="button" class="btn secondary" data-action="fillStats">Fill in a statistics example</button>
            </div>
            <p class="small muted" id="aiStatus">${esc(aiStatus().text)}</p>
          </form>
        </div>
        <aside class="home-aside" aria-labelledby="flowTitle">
          <h2 id="flowTitle">How a session runs</h2>
          <ol class="flow">
            <li><b>Find the gaps</b><span>Up to five ideas or academic words the passage assumes, each with why it matters.</span></li>
            <li><b>Quick check</b><span>One question each on the top three, so Bridge doesn't rely on “I think I know it”.</span></li>
            <li><b>Bridge the missed ones</b><span>Intuition, a precise definition and an example, then one new immediate recheck per missed prerequisite.</span></li>
            <li><b>Reread with highlights</b><span>Tap any marked word in the passage to see its explanation again.</span></li>
            <li><b>Practice and review</b><span>Three questions on the passage, then spaced review of what you missed after 1, 3 and 7 days.</span></li>
          </ol>
          <p class="small muted">Teachers: the <button type="button" class="linkish" data-action="teacherMode">Teacher view</button> shows which prerequisites students on this device missed most.</p>
        </aside>
      </div>`;
  };

  VIEWS.gaps = () => {
    const g = S.gapsState || { status: "loading" };
    if (g.status === "loading") return loadingView("Gaps", "Finding what this passage assumes");
    if (g.status === "error") return `<p class="eyebrow">Gaps</p><h2 tabindex="-1" data-focus>Finding what this passage assumes</h2>${errorBox(g.error, "retryGaps", `<button type="button" class="btn ghost small" data-action="home">Edit the passage</button>`)}`;
    const list = prereqs();
    if (!list.length) {
      return `<p class="eyebrow">Gaps</p><h2 tabindex="-1" data-focus>No hidden prerequisites found</h2>
        <div class="callout info"><p>Bridge didn't find background ideas or academic words this text takes for granted. It may be very basic, or it may not be study material.</p></div>
        <div class="passage">${esc(S.passage)}</div>
        <div class="actions"><button type="button" class="btn primary" data-action="home">Try another passage</button></div>`;
    }
    const targets = new Set(diagTargets().map((p) => p.pi));
    const sel = list[S.selectedChip] || list[0];
    const chip = (p) => `<button type="button" class="chip ${p.type} ${p.pi === sel.pi ? "is-selected" : ""} ${p.unsure ? "is-unsure" : ""}" data-action="selectChip" data-pi="${p.pi}" aria-pressed="${p.pi === sel.pi}">
        <span class="chip-rank">#${p.pi + 1}</span><span class="chip-term">${esc(p.term)}</span>${impDots(p.importance)}${p.unsure ? `<span class="chip-flag">not sure</span>` : ""}${targets.has(p.pi) ? `<span class="chip-check">✓ quick check</span>` : ""}</button>`;
    const group = (type, title, blurb) => {
      const items = list.filter((p) => p.type === type);
      return `<section class="chip-group"><h3 class="group-title">${title} <span class="count">${items.length}</span></h3><p class="small muted">${blurb}</p>
        <div class="chips">${items.length ? items.map(chip).join("") : `<p class="small muted">None found in this passage.</p>`}</div></section>`;
    };
    const n = targets.size;
    return `
      <p class="eyebrow">Gaps</p>
      <h2 tabindex="-1" data-focus>What this passage assumes you know</h2>
      <p class="muted">Ranked by how much this passage depends on each one (dots show importance). Tap a chip to see why it matters.</p>
      ${homeworkNote()}
      <div class="panel">
        ${group("concept", "Concept prerequisites", "Ideas or notation from earlier courses that the passage uses without explaining.")}
        ${group("language", "Academic-language prerequisites", "Words and phrases the passage expects you to know already.")}
        <div class="why-panel" aria-live="polite">
          <p class="why-term"><span>${esc(sel.term)}</span><span class="tag ${sel.type}">${typeLabel(sel.type)}</span></p>
          <p>${esc(sel.why_needed || "No reason given.")}</p>
          ${sel.unsure ? `<p class="small" style="color:var(--warn)"><strong>Bridge isn't sure about this one.</strong> The passage may explain it, or it may not matter much.</p>` : ""}
          <p class="small muted">Importance ${sel.importance} of 5${targets.has(sel.pi) ? " · included in the quick check" : ""}</p>
        </div>
      </div>
      <details class="passage-peek"><summary>Show the passage</summary>${speakButton(S.passage, "en-US", "Read passage aloud")}<div class="passage">${esc(S.passage)}</div></details>
      <div class="actions"><button type="button" class="btn primary" data-action="startDiag" data-autofocus>Check what I already know (${n} ${n === 1 ? "question" : "questions"})</button></div>
      <p class="small muted">Bridge doesn't rely on “I already know that.” It asks one short question about each of the top ${n}, then teaches only what you miss.</p>`;
  };

  function optionsBlock(q, ans, action) {
    return `<div class="options">${q.options.map((o, k) => {
      let st = "";
      if (ans) st = k === q.correct_index ? "is-correct" : (k === ans.choice ? "is-wrong" : "is-dim");
      return `<button type="button" class="opt ${st}" data-action="${action}" data-k="${k}" ${ans ? "disabled" : ""}><span class="opt-key" aria-hidden="true">${LETTERS[k]}</span><span class="opt-text"><span class="vh">Option ${LETTERS[k]}: </span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  }

  VIEWS.check = () => {
    const d = S.diag;
    if (!d || d.status === "loading") return loadingView("Check", "Writing your quick check");
    if (d.status === "error") return `<p class="eyebrow">Check</p><h2 tabindex="-1" data-focus>Writing your quick check</h2>${errorBox(d.error, "retryDiag", `<button type="button" class="btn ghost small" data-action="backToGaps">Back to the gaps</button>`)}`;
    const i = d.index, item = d.items[i], ans = d.answers[i];
    const last = i + 1 >= d.items.length;
    let fb = "";
    if (ans) {
      const right = `${LETTERS[item.correct_index]}: ${item.options[item.correct_index]}`;
      if (ans.correct) fb = `<div class="feedback good"><p><strong>Correct.</strong> ${esc(item.explanation)}</p></div>`;
      else if (ans.unsure) fb = `<div class="feedback neutral"><p><strong>Thanks for being honest.</strong> The answer is ${esc(right)}. ${esc(item.explanation)}</p><p>Bridge will fill this in next.</p></div>`;
      else fb = `<div class="feedback bad"><p><strong>Not quite.</strong> The answer is ${esc(right)}. ${esc(item.explanation)}</p><p>Bridge will fill this in next.</p></div>`;
    }
    return `
      <p class="eyebrow">Quick check · ${i + 1} of ${d.items.length}</p>
      <p class="muted small">Answer from what you know right now. If you don't know, choose “Not sure”: guessing hides what you need.</p>
      <p class="about">Checks <span class="tag ${item.type}">${typeLabel(item.type)}</span><strong>${esc(item.term)}</strong></p>
      <h2 class="question" tabindex="-1" data-focus>${esc(item.question)}</h2>
      ${optionsBlock(item, ans, "diagPick")}
      ${ans ? fb : `<div class="actions"><button type="button" class="btn ghost" data-action="diagUnsure">Not sure</button></div>`}
      ${ans ? `<div class="actions"><button type="button" class="btn primary" data-action="diagNext" data-autofocus>${last ? "See what to fill in" : "Next question"}</button></div>` : ""}`;
  };

  function bridgeBody(pi, compact) {
    const b = S.bridges[pi];
    const p = prereqs()[pi];
    if (!b || b.status === "loading") return `<div class="loading-line small"><span class="spinner" aria-hidden="true"></span><span>Writing a short explanation of ${esc(p.term)}…</span></div><div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>`;
    if (b.status === "error") return errorBox(b.error, "retryBridge").replace('data-action="retryBridge"', `data-action="retryBridge" data-pi="${pi}"`);
    const d = b.data;
    const listen = speakButton([d.intuition, d.definition, d.example].join(" "), "en-US", "Read explanation aloud");
    if (compact) {
      return `${listen}${glossFor(d)}<dl class="kv"><dt>Idea</dt><dd>${esc(d.intuition)}</dd><dt>Means</dt><dd>${esc(d.definition)}</dd><dt>Here</dt><dd>${esc(d.example)}</dd></dl>`;
    }
    return `${listen}${glossFor(d)}
      <div class="bc-step"><h4>Intuition</h4><p>${esc(d.intuition)}</p></div>
      <div class="bc-step"><h4>Definition</h4><p>${esc(d.definition)}</p></div>
      <div class="bc-step"><h4>Example from your passage</h4><p>${esc(d.example)}</p></div>`;
  }

  VIEWS.bridge = () => {
    const missed = missedItems();
    const ready = missed.every((it) => S.bridges[it.pi] && S.bridges[it.pi].status === "ready");
    return `
      <p class="eyebrow">Bridge · ${missed.length} to fill in</p>
      <h2 tabindex="-1" data-focus>Fill the gaps, just in time</h2>
      <p class="muted">Only for what the quick check showed you're missing. Each one takes about a minute. Then go back to the passage.</p>
      ${homeworkNote()}
      ${glossToggle()}
      ${missed.map((it) => `<article class="bridge-card"><header class="bc-head"><span><span class="tag ${it.type}">${typeLabel(it.type)}</span></span><h3>${esc(it.term)}</h3></header>${bridgeBody(it.pi, false)}</article>`).join("")}
      <div class="actions"><button type="button" class="btn primary" data-action="startRecheck" ${ready ? "" : "disabled"}>Check these gaps again</button></div>
      <p class="small muted">One new question on each missed prerequisite, then back to the passage.</p>`;
  };

  VIEWS.recheck = () => {
    const r = S.recheck;
    if (!r || r.status === "loading") return loadingView("Immediate recheck", "Writing a new question for each gap");
    if (r.status === "error") return `<h2 tabindex="-1" data-focus>Immediate recheck unavailable</h2>${errorBox(r.error, "startRecheck", '<button type="button" class="btn ghost small" data-action="skipRecheck">Continue without a recheck</button>')}<p class="small muted">An unanswered recheck is not counted as a correct or incorrect result.</p>`;
    const i = r.index, q = r.items[i], ans = r.answers[i];
    return `<h2 tabindex="-1" data-focus>Immediate recheck · ${i + 1} of ${r.items.length}</h2>
      <p class="muted small">A new question on what you just studied. This checks understanding right now, not long-term retention.</p>
      <p class="about"><strong>${esc(q.term)}</strong></p><h3 class="question">${esc(q.question)}</h3>
      ${optionsBlock(q, ans, "recheckPick")}
      ${ans ? `<div class="feedback ${ans.correct ? "good" : "neutral"}"><p><strong>${ans.correct ? "Correct." : ans.unsure ? "Thanks for being honest." : "Not quite."}</strong> ${ans.correct ? "" : `The answer is ${esc(q.options[q.correct_index])}. `}${esc(q.explanation)}</p></div><div class="actions"><button type="button" class="btn primary" data-action="recheckNext" data-autofocus>${i + 1 === r.items.length ? "Back to the passage" : "Next question"}</button></div>` : '<div class="actions"><button type="button" class="btn ghost" data-action="recheckUnsure">Not sure</button></div>'}`;
  };

  VIEWS.reread = () => {
    const { html, inText } = highlightedPassage();
    const list = prereqs();
    const notInText = list.filter((p) => !inText.has(p.pi));
    if (S.openTerm === null || !list[S.openTerm]) {
      const firstBridged = list.find((p) => isBridged(p.pi) && inText.has(p.pi));
      const firstMarked = list.find((p) => inText.has(p.pi));
      S.openTerm = (firstBridged || firstMarked || list[0] || { pi: null }).pi;
    }
    const p = list[S.openTerm];
    let panel = `<p class="muted">Tap a marked word in the passage.</p>`;
    if (p) {
      const bridged = isBridged(p.pi);
      const b = S.bridges[p.pi];
      panel = `<p class="why-term"><span class="tag ${p.type}">${typeLabel(p.type)}</span>${bridged ? `<span class="tag neutral">you just learned this</span>` : ""}</p><h3>${esc(p.term)}</h3>`;
      if (bridged || b) panel += bridgeBody(p.pi, true);
      else panel += `<p>${esc(p.why_needed)}</p><div class="actions"><button type="button" class="btn secondary small" data-action="explainTerm" data-pi="${p.pi}">Explain this to me</button></div>`;
    }
    const skipped = S.bridgeSkipped ? `<div class="callout good" role="status"><strong>Bridge and recheck skipped.</strong><p>You answered all ${S.diag.items.length} quick-check questions correctly, so there was nothing to fill in. You can still tap any marked word.</p></div>` : "";
    return `
      ${skipped}
      ${S.session && S.session.recheck_status === "recheck_unavailable" ? '<div class="callout info" role="status"><strong>Immediate recheck unavailable.</strong><p>You can keep reading. These prerequisites have no post result and are excluded from pre/post statistics.</p></div>' : ""}
      <p class="eyebrow">Back to the passage</p>
      <h2 tabindex="-1" data-focus>Read it again, with the gaps filled</h2>
      <p class="muted">${S.bridgeSkipped ? "Marked words are ideas this passage assumes." : "Highlighted words are the ones you just learned."} Tap any marked word to see its explanation.</p>
      <div class="legend">${S.bridgeSkipped ? "" : `<span><span class="swatch-hl">highlight</span> you just learned it</span>`}<span><span class="swatch-dot">dotted</span> other assumed ideas</span></div>
      ${glossToggle()}
      ${speakButton(S.passage, "en-US", "Read passage aloud")}
      <div class="passage">${html}</div>
      <div class="term-panel" id="termPanel" aria-live="polite">${panel}</div>
      ${notInText.length ? `<div class="stack"><p class="small muted">Also assumed, but not written out in the text:</p><div class="chips">${notInText.map((q) => `<button type="button" class="chip ${q.type}" data-action="openTerm" data-pi="${q.pi}"><span class="chip-term">${esc(q.term)}</span></button>`).join("")}</div></div>` : ""}
      <div class="actions"><button type="button" class="btn primary" data-action="toPractice">Start the ${S.mini && S.mini.status === "ready" ? S.mini.questions.length : 3}-question check</button></div>`;
  };

  VIEWS.practice = () => {
    const m = S.mini;
    if (!m || m.status === "loading") return loadingView("Practice", "Writing your 3-question check");
    if (m.status === "error") return `<p class="eyebrow">Practice</p><h2 tabindex="-1" data-focus>Writing your 3-question check</h2>${errorBox(m.error, "retryMini", `<button type="button" class="btn ghost small" data-action="toSurvey">Skip to feedback</button>`)}`;
    if (m.finished) {
      const score = m.answers.filter((a) => a && a.correct).length;
      return `
        <p class="eyebrow">Practice · results</p>
        <h2 tabindex="-1" data-focus>Your ${m.questions.length}-question check</h2>
        <div class="panel">
          <p class="score"><b>${score}/${m.questions.length}</b><span class="muted">${score === m.questions.length ? "All correct. Nice work." : "Each miss is now on your review list."}</span></p>
          <ul class="result-list">${m.questions.map((q, i) => `<li><span class="mk ${m.answers[i] && m.answers[i].correct ? "ok" : "no"}" aria-hidden="true">${m.answers[i] && m.answers[i].correct ? "✓" : "✗"}</span><span><span class="tag neutral">${esc(q.difficulty)}</span> ${esc(q.question)}</span></li>`).join("")}</ul>
        </div>
        ${m.reviewCount && m.reviewDates ? `<div class="callout info"><strong>Spaced review scheduled for ${m.reviewCount} ${m.reviewCount === 1 ? "item" : "items"}</strong><p>Bridge will bring back what you missed in the quick check and this check on ${m.reviewDates.map((d, i) => `${esc(fmtDate(d))} (${REVIEW_DAYS[i]} day${REVIEW_DAYS[i] > 1 ? "s" : ""})`).join(", ")}. Look for “Review due” when you come back.</p></div>` : score === m.questions.length ? `<div class="callout good"><p>Nothing to review later. You got everything right.</p></div>` : `<div class="callout info"><p>What you missed is already on your review list.</p></div>`}
        <div class="actions"><button type="button" class="btn primary" data-action="toSurvey" data-autofocus>Give quick feedback</button></div>`;
    }
    const i = m.index, q = m.questions[i], ans = m.answers[i];
    const last = i + 1 >= m.questions.length;
    let fb = "";
    if (ans) {
      fb = ans.correct
        ? `<div class="feedback good"><p><strong>Correct.</strong> ${esc(q.explanation)}</p></div>`
        : `<div class="feedback bad"><p><strong>Not quite.</strong> The answer is ${LETTERS[q.correct_index]}: ${esc(q.options[q.correct_index])}. ${esc(q.explanation)}</p></div>`;
    }
    return `
      <p class="eyebrow">Practice · ${i + 1} of ${m.questions.length}</p>
      <p class="muted small">These questions are about the passage itself. Try to answer from memory first.</p>
      <p class="about"><span class="tag neutral">${esc(q.difficulty)}</span></p>
      <h2 class="question" tabindex="-1" data-focus>${esc(q.question)}</h2>
      ${optionsBlock(q, ans, "miniPick")}
      ${fb}
      ${ans ? `<div class="actions"><button type="button" class="btn primary" data-action="miniNext" data-autofocus>${last ? "See my results" : "Next question"}</button></div>` : ""}`;
  };

  VIEWS.survey = () => {
    const sv = S.survey;
    const radios = (name, values, labels) => values.map((v, i) => `<input type="radio" id="${name}-${i}" name="${name}" value="${v}" ${String(sv[name]) === String(v) ? "checked" : ""}><label for="${name}-${i}">${labels[i]}</label>`).join("");
    return `
      <p class="eyebrow">Feedback</p>
      <h2 tabindex="-1" data-focus>Three quick questions</h2>
      <p class="muted">Anonymous. Your answers help show whether Bridge works for students like you.</p>
      <form id="surveyForm" class="panel stack-lg" novalidate>
        <div><fieldset class="seg"><legend>1. How helpful was this?</legend>${radios("helpful", [1, 2, 3, 4, 5], ['1<span class="vh"> (not helpful)</span>', "2", "3", "4", '5<span class="vh"> (very helpful)</span>'])}</fieldset><div class="scale-ends"><span>1 = not helpful</span><span>5 = very helpful</span></div></div>
        <fieldset class="seg"><legend>2. Did it find something you actually didn't know?</legend>${radios("found_new", ["yes", "no"], ["Yes", "No"])}</fieldset>
        <div class="field"><label class="field-label" for="confusing">3. What still confuses you? (optional)</label>
          <textarea id="confusing" rows="3" maxlength="1000" style="min-height:6rem">${esc(sv.text)}</textarea>
          <p class="notice">${ICON.lock}<span>Don't include personal information.</span></p></div>
        <div class="actions"><button type="submit" class="btn primary">Send feedback</button><button type="button" class="btn ghost" data-action="skipSurvey">Skip</button></div>
      </form>`;
  };

  VIEWS.done = () => {
    const s = S.session || {};
    const mins = fmtDuration(s.time_spent_sec || 0);
    return `
      <p class="eyebrow">Session complete · ${esc(s.id || "")}</p>
      <h2 tabindex="-1" data-focus>Done. Here's what happened.</h2>
      <div class="tiles">
        <div class="tile"><b>${s.n_prerequisites || 0}</b><span>prerequisites found (${s.n_concept || 0} concept, ${s.n_language || 0} language)</span></div>
        <div class="tile"><b>${s.diagnostics_missed || 0}/${(s.diagnostics || []).length}</b><span>missed in the quick check</span></div>
        <div class="tile"><b>${s.minicheck_score ?? "–"}/${s.minicheck_total ?? 3}</b><span>on the 3-question check</span></div>
        <div class="tile"><b>${esc(mins)}</b><span>time spent</span></div>
      </div>
      ${s.reviews_scheduled ? `<p>You have ${s.reviews_scheduled} ${s.reviews_scheduled === 1 ? "item" : "items"} scheduled for spaced review. Come back tomorrow and look for “Review due”.</p>` : ""}
      <div class="actions"><button type="button" class="btn primary" data-action="newPassage">Start another passage</button></div>
      <div class="panel"><h3>Your data</h3><p class="small muted">Bridge keeps an anonymous log on this device only. Export it to share with the Bridge team if you were asked to.</p>
        <div class="actions"><button type="button" class="btn secondary small" data-action="exportJSON">Export my session data (JSON)</button><button type="button" class="btn secondary small" data-action="exportCSV">Export as CSV</button></div></div>`;
  };

  VIEWS.review = () => {
    const due = dueReviews();
    const rv = S.review || { answered: null, doneCount: 0 };
    if (!due.length && !rv.answered) {
      return `<p class="eyebrow">Spaced review</p><h2 tabindex="-1" data-focus>${rv.doneCount ? "Review finished" : "Nothing due right now"}</h2>
        <p class="muted">${rv.doneCount ? `You reviewed ${rv.doneCount} ${rv.doneCount === 1 ? "item" : "items"}.` : ""} ${nextUpcoming() ? `Next review: ${esc(fmtDate(nextUpcoming().due_at))}.` : ""}</p>
        <div class="actions"><button type="button" class="btn primary" data-action="home">Back to start</button></div>`;
    }
    const r = rv.answered ? rv.answered.item : due[0];
    const ans = rv.answered ? { choice: rv.answered.choice, correct: rv.answered.correct } : null;
    const q = { options: r.options, correct_index: r.correct_index };
    return `
      <p class="eyebrow">Spaced review · ${due.length} due</p>
      <p class="about"><span class="tag neutral">${r.kind === "prerequisite" ? "background" : "passage"}</span>${r.term ? `<strong>${esc(r.term)}</strong>` : ""}<span class="muted small">${esc(courseById(r.course).label)}</span></p>
      <h2 class="question" tabindex="-1" data-focus>${esc(r.question)}</h2>
      ${optionsBlock(q, ans, "reviewPick")}
      ${ans ? `<div class="feedback ${ans.correct ? "good" : "bad"}"><p><strong>${ans.correct ? "Correct." : "Not quite."}</strong> ${ans.correct ? "" : `The answer is ${LETTERS[r.correct_index]}: ${esc(r.options[r.correct_index])}. `}${esc(r.explanation)}</p><p class="small">${ans.correct ? (r.stage + 1 >= r.due_dates.length ? "This one is retired. Well remembered." : "See you at the next review date.") : "Bridge will ask this again tomorrow."}</p></div>
        <div class="actions"><button type="button" class="btn primary" data-action="reviewNext" data-autofocus>Continue</button></div>` : ""}`;
  };

  // ---------- Teacher view ----------
  function classSummary(sessions) {
    const terms = new Map();
    const passages = new Map();
    const split = { concept: { detected: 0, checked: 0, missed: 0 }, language: { detected: 0, checked: 0, missed: 0 } };
    const entry = (t) => {
      const term = String(t.term || "(unnamed)");
      const key = normTerm(term.replace(/\s*\([^)]*\)/g, " ")) || normTerm(term); // "i.i.d. (independent …)" groups with "i.i.d."
      if (!terms.has(key)) terms.set(key, { key, term, type: t.type === "language" ? "language" : "concept", detected: 0, checked: 0, missed: 0, rechecked: 0, postCorrect: 0, recheckUnavailable: 0, why: "", courses: new Set(), passages: new Set(), passageIds: new Set(), sessionIds: new Set() });
      return terms.get(key);
    };
    for (const s of sessions) {
      for (const p of (s.prerequisites || []).filter(Boolean)) { const e = entry(p); e.detected++; split[e.type].detected++; }
      let missedHere = 0;
      for (const d of (s.diagnostics || []).filter(Boolean)) {
        const e = entry(d);
        e.checked++; split[e.type].checked++;
        e.courses.add(s.course); e.passages.add(s.passage_label || "untitled"); e.passageIds.add(s.passage_id || "unknown"); e.sessionIds.add(s.id);
        if (!e.why && d.why_needed) e.why = d.why_needed;
        if (!d.correct) { e.missed++; split[e.type].missed++; missedHere++; }
      }
      const pk = s.passage_id || "unknown";
      for (const pair of s.prerequisite_pre_post || []) {
        if (pair.pre === false && pair.post_status === "recheck_unavailable") entry(pair).recheckUnavailable++;
        if (pair.pre === false && typeof pair.post === "boolean") {
          const e = entry(pair); e.rechecked++; if (pair.post) e.postCorrect++;
        }
      }
      if (!passages.has(pk)) passages.set(pk, { id: pk, label: s.passage_label || "untitled", course: s.course, sessions: 0, withMiss: 0, prereqs: 0, checked: 0, missed: 0, miniSum: 0, miniN: 0, miniTotal: 0 });
      const pe = passages.get(pk);
      pe.sessions++; if (missedHere) pe.withMiss++; pe.prereqs += s.n_prerequisites || 0; pe.checked += (s.diagnostics || []).length; pe.missed += missedHere;
      if (typeof s.minicheck_score === "number") { pe.miniSum += s.minicheck_score; pe.miniN++; pe.miniTotal += s.minicheck_total || 3; }
    }
    const missedTerms = [...terms.values()].filter((e) => e.checked > 0)
      .sort((a, b) => (b.missed - a.missed) || (b.missed / b.checked - a.missed / a.checked) || a.term.localeCompare(b.term));
    const passageList = [...passages.values()].sort((a, b) => (b.missed / b.sessions - a.missed / a.sessions) || (b.prereqs / b.sessions - a.prereqs / a.sessions));
    return { sessions: sessions.length, missedTerms, passageList, split };
  }

  function templateLesson(e) {
    return `Students most often missed “${e.term}” (${e.missed} of ${e.checked} checked). A 5-minute plan: ask the class to say in their own words what “${e.term}” means, then show the one place in the reading where it is needed${e.why ? ` (${e.why.replace(/\.$/, "")})` : ""}. Work one tiny example on the board, and give one similar mini-question for students to try on whiteboards. Close by naming the most common wrong answer you saw.${e.type === "language" ? " Because this is an academic-language gap, give a plain-English paraphrase and point to where the phrase appears in the reading." : ""}`;
  }
  const lessonCacheKey = (e) => `${e.key}|${[...e.passageIds].sort().join(",")}`;
  function lessonFor(e) {
    if (!e) return null;
    const cache = store.get(K.lessons, {}) || {};
    const hit = cache[lessonCacheKey(e)];
    if (hit && typeof hit.text === "string") return { text: hit.text, source: "Drafted by AI for these passages", ai: true };
    // Saved lessons cite a specific passage: never reuse one for another reading.
    const demo = DEMOS.find((d) => [...e.passageIds].every((id) => id === hashText(d.passage)));
    if (demo && demo.data.lessons[e.key]) return { text: demo.data.lessons[e.key], source: "Saved example (written for this demo passage)" };
    return null;
  }
  async function draftLesson(e) {
    S.teacher.lessonStatus = "loading"; S.teacher.lessonError = null; render();
    try {
      const text = await generateJSON("makeLesson", { prompt: promptLesson({ entry: e }), validate: validateLesson, schema: SCHEMA.lesson });
      const cache = store.get(K.lessons, {}) || {};
      cache[lessonCacheKey(e)] = { text, at: now() };
      store.set(K.lessons, cache);
      S.teacher.lessonStatus = "idle";
    } catch (err) {
      S.teacher.lessonStatus = "error"; S.teacher.lessonError = friendly(err);
    }
    if (S.view === "teacher") render();
  }

  VIEWS.teacher = () => {
    const all = loadSessions();
    const examples = all.filter((s) => s.example_data).length;
    const sessions = all.filter((s) => (s.diagnostics || []).length); // students who reached the quick check
    const sum = classSummary(sessions);
    const head = `
      <p class="eyebrow">Teacher view · sessions on this device</p>
      <h1 tabindex="-1" data-focus>Where students may be off-track</h1>
      <div class="callout info"><strong>This flags where students may be off-track so you can decide how to intervene.</strong><p class="small">No student names are collected. Each session has a random anonymous ID, such as ${esc((sessions[0] && sessions[0].id) || "S-4F2A1C")}.</p></div>
      <p class="small muted">Counts the ${sessions.length} ${sessions.length === 1 ? "session" : "sessions"} on this device that reached the quick check.</p>
      ${examples ? `<div class="banner"><span>Includes ${examples} example sessions (made-up students, for demonstration).</span><button type="button" class="linkish" data-action="removeExamples">Remove example data</button></div>` : ""}`;
    if (!sessions.length) {
      return `${head}<div class="panel"><h3>No sessions yet</h3><p class="muted">When students use Bridge on this device, their anonymous results appear here: which prerequisites they missed, language versus concept gaps, and which passages caused the most trouble.</p>

    }
    const top = sum.missedTerms.filter((e) => e.missed > 0);
    const totalMissed = sum.split.concept.missed + sum.split.language.missed;
    const cPct = pct(sum.split.concept.missed, totalMissed);
    const first = top[0];
    const lesson = lessonFor(first);
    let lessonBlock = "";
    if (first) {
      lessonBlock = `<section class="section panel" aria-labelledby="lessonTitle">
          <p class="eyebrow">Suggested 5-minute mini-lesson</p>
          <h2 id="lessonTitle">For the #1 gap: ${esc(first.term)}</h2>
          <p class="small muted">A suggestion for you to review and adapt. Bridge never assigns it to students; you decide whether to use it.</p>
          ${S.teacher.lessonStatus === "loading" ? `<div class="loading-line"><span class="spinner" aria-hidden="true"></span><span>Drafting a suggestion…</span></div>`
            : lesson ? `<p class="lesson">${esc(lesson.text)}</p><p class="small muted">${esc(lesson.source)}</p>`
            : `<p class="lesson">${esc(templateLesson(first))}</p><p class="small muted">Basic template. ${aiStatus().mode === "none" ? "Connect live AI in Settings for a tailored draft." : ""}</p>`}
          ${S.teacher.lessonStatus === "error" ? `<div class="callout bad" role="alert"><p>${esc(S.teacher.lessonError)}</p></div>` : ""}
          ${aiStatus().mode !== "none" && S.teacher.lessonStatus !== "loading" ? `<div class="actions"><button type="button" class="btn secondary small" data-action="draftLesson">${lesson && lesson.ai ? "Redraft with AI" : "Draft a tailored suggestion with AI"}</button></div>` : ""}
        </section>`;
    }
    return `${head}
      <div class="tiles three">
        <div class="tile"><b>${sum.sessions}</b><span>anonymous sessions</span></div>
        <div class="tile"><b>${totalMissed}</b><span>prerequisites missed in quick checks</span></div>
        <div class="tile"><b>${sum.passageList.length}</b><span>${sum.passageList.length === 1 ? "passage" : "passages"}</span></div>

        <h2 id="missTitle">Prerequisites students missed most</h2>
        <p class="small muted">Out of the students who were checked on each one. “Missed” includes “Not sure”.</p>
        ${top.length ? `<ol class="miss-list">${top.slice(0, 8).map((e, i) => `<li class="miss-row"><span class="miss-rank">${i + 1}</span>
            <span class="miss-head"><b>${esc(e.term)}</b><span class="tag ${e.type}">${typeLabel(e.type)}</span></span>
            <span class="miss-bar ${e.type}" role="img" aria-label="${pct(e.missed, e.checked)} percent missed"><i style="width:${pct(e.missed, e.checked)}%"></i></span>

        <ul>${sum.missedTerms.map((e) => `<li><strong>${esc(e.term)}</strong>: ${e.rechecked ? `0/${e.rechecked} → ${e.postCorrect}/${e.rechecked} correct` : "no matched rechecks"}${e.missed > e.rechecked ? ` · ${e.missed - e.rechecked} missed without a post result` : ""}${e.recheckUnavailable ? ` · ${e.recheckUnavailable} recheck_unavailable (excluded)` : ""}</li>`).join("")}</ul>
      </section>
      <section class="section" aria-labelledby="splitTitle">
        <h2 id="splitTitle">Language gaps vs. concept gaps</h2>
        ${totalMissed ? `<div class="split" role="img" aria-label="${cPct} percent concept, ${100 - cPct} percent language"><i class="c" style="width:${cPct}%"></i><i class="l" style="width:${100 - cPct}%"></i></div>` : ""}
        <div class="split-legend">
          <span><i class="dot c"></i>Concept: ${sum.split.concept.missed} missed of ${sum.split.concept.checked} checked (${pct(sum.split.concept.missed, sum.split.concept.checked)}%) · ${sum.split.concept.detected} found in passages</span>
          <span><i class="dot l"></i>Academic language: ${sum.split.language.missed} missed of ${sum.split.language.checked} checked (${pct(sum.split.language.missed, sum.split.language.checked)}%) · ${sum.split.language.detected} found in passages</span>

            <td class="num">${p.sessions}</td><td class="num">${(p.prereqs / p.sessions).toFixed(1)}</td><td class="num">${(p.missed / p.sessions).toFixed(1)} of ${(p.checked / p.sessions).toFixed(1)}</td>

        </table></div>
      </section>

      <section class="section">
        <div class="actions"><button type="button" class="btn secondary" data-action="exportClassCSV">Export class summary (CSV)</button>

      </section>`;
  };

  // ---------- Evidence log (admin) ----------
  function evidenceStats(sessions) {
    const withMini = sessions.filter((s) => typeof s.minicheck_score === "number" && s.minicheck_total);
    const diag = sessions.flatMap((s) => s.diagnostics || []);
    const surveyed = sessions.filter((s) => s.survey && typeof s.survey.helpful === "number");
    const foundAns = sessions.filter((s) => s.survey && (s.survey.found_new === "yes" || s.survey.found_new === "no"));
    const missedPairs = sessions.flatMap((s) => s.prerequisite_pre_post || []).filter((p) => p.pre === false);
    const matched = missedPairs.filter((p) => typeof p.post === "boolean");
    return {
      recheckN: matched.length, recheckCorrect: matched.filter((p) => p.post).length, recheckMissing: missedPairs.length - matched.length,
      recheckUnavailable: missedPairs.filter((p) => p.post_status === "recheck_unavailable").length,
      sessions: sessions.length,
      completed: sessions.filter((s) => s.completed).length,
      avgMini: withMini.length ? withMini.reduce((a, s) => a + s.minicheck_score / s.minicheck_total, 0) / withMini.length : null,
      avgMiniRaw: withMini.length ? withMini.reduce((a, s) => a + s.minicheck_score, 0) / withMini.length : null,
      avgMiniTotal: withMini.length ? withMini.reduce((a, s) => a + s.minicheck_total, 0) / withMini.length : null,
      diagMissedPct: diag.length ? pct(diag.filter((d) => !d.correct).length, diag.length) : null,
      diagN: diag.length,
      avgHelpful: surveyed.length ? surveyed.reduce((a, s) => a + s.survey.helpful, 0) / surveyed.length : null,
      surveyedN: surveyed.length,
      foundNewPct: foundAns.length ? pct(foundAns.filter((s) => s.survey.found_new === "yes").length, foundAns.length) : null,
      avgTime: sessions.length ? Math.round(sessions.reduce((a, s) => a + (s.time_spent_sec || 0), 0) / sessions.length) : null,
    };
  }
  VIEWS.admin = () => {
    const all = loadSessions();
    const examples = all.filter((s) => s.example_data).length;
    const sessions = S.admin.includeExamples ? all : all.filter((s) => !s.example_data);
    const st = evidenceStats(sessions);
    const rows = sessions.slice().sort((a, b) => String(b.started_at).localeCompare(String(a.started_at)));
    return `
      <p class="eyebrow">Evidence log · this device</p>
      <h1 tabindex="-1" data-focus>Session data</h1>
      <p class="muted">Everything Bridge logged on this device. No names, emails or accounts. Passage text is stored only as a short label and an ID.</p>
      ${examples ? `<label class="toggle"><input type="checkbox" id="incEx" data-change="includeExamples" ${S.admin.includeExamples ? "checked" : ""}> Include ${examples} example sessions (made-up data)</label>` : ""}
      <p><strong>Missed prerequisites answered correctly right after the bridge: ${st.recheckCorrect} of ${st.recheckN} (${st.recheckN ? pct(st.recheckCorrect, st.recheckN) : 0}%)</strong></p>
      <p class="small muted">Immediate recheck, not long-term retention; small samples. Counts answered posts only; ${st.recheckMissing} missed prerequisites have no post result, including ${st.recheckUnavailable} recheck_unavailable (excluded from pre/post statistics). Older sessions without rechecks are excluded.</p>
      <div class="tiles">
        <div class="tile"><b>${st.sessions}</b><span>sessions (${st.completed} completed)</span></div>
        <div class="tile"><b>${st.avgMini === null ? "–" : Math.round(st.avgMini * 100) + "%"}</b><span>average mini-check score${st.avgMiniRaw === null ? "" : ` (${st.avgMiniRaw.toFixed(1)} of ${st.avgMiniTotal.toFixed(0)})`}</span></div>
        <div class="tile"><b>${st.diagMissedPct === null ? "–" : st.diagMissedPct + "%"}</b><span>of ${st.diagN} diagnostic answers missed</span></div>
        <div class="tile"><b>${st.avgHelpful === null ? "–" : st.avgHelpful.toFixed(1)}</b><span>average helpfulness (1–5, n=${st.surveyedN})</span></div>
        <div class="tile"><b>${st.foundNewPct === null ? "–" : st.foundNewPct + "%"}</b><span>said it found something they didn't know</span></div>
        <div class="tile"><b>${st.avgTime === null ? "–" : esc(fmtDuration(st.avgTime))}</b><span>average time per session</span></div>
      </div>
      <div class="actions"><button type="button" class="btn secondary small" data-action="exportJSON">Export JSON</button><button type="button" class="btn secondary small" data-action="exportCSV">Export CSV</button>
        ${examples ? `<button type="button" class="btn ghost small" data-action="removeExamples">Remove example data</button>` : `<button type="button" class="btn ghost small" data-action="addExamples">Add example data</button>`}</div>
      ${rows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Session</th><th>Started</th><th>Course</th><th>Lang</th><th class="num">Prereqs</th><th class="num">Diag missed</th><th class="num">Mini-check</th><th class="num">Time</th><th class="num">Helpful</th></tr></thead>
        <tbody>${rows.map((s) => `<tr><td>${esc(s.id)}${s.example_data ? ' <span class="tag neutral">example</span>' : ""}${s.completed ? "" : ' <span class="tag neutral">unfinished</span>'}</td><td>${esc(fmtDateTime(Date.parse(s.started_at)))}</td><td>${esc(courseById(s.course).label)}</td><td>${esc(langById(s.home_language).label)}</td>
          <td class="num">${s.n_prerequisites ?? 0}</td><td class="num">${(s.diagnostics || []).length ? `${s.diagnostics_missed}/${s.diagnostics.length}` : "–"}</td><td class="num">${typeof s.minicheck_score === "number" ? `${s.minicheck_score}/${s.minicheck_total}` : "–"}</td>
          <td class="num">${esc(fmtDuration(s.time_spent_sec || 0))}</td><td class="num">${s.survey && typeof s.survey.helpful === "number" ? s.survey.helpful : "–"}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">No sessions logged on this device yet.</p>`}
      <div class="panel"><h3>Delete data</h3><p class="small muted">Removes every session, review and saved setting on this device. This can't be undone.</p>
        ${S.admin.confirmClear ? `<div class="confirm-row"><strong>Delete everything?</strong><button type="button" class="btn small" style="background:var(--bad);color:var(--surface)" data-action="clearAllConfirmed">Yes, delete</button><button type="button" class="btn ghost small" data-action="clearAllCancel">Cancel</button></div>`
          : `<div class="actions"><button type="button" class="btn ghost small" data-action="clearAll">Delete all data on this device</button></div>`}</div>`;
  };

  // ---------- Settings ----------
  VIEWS.settings = () => {
    const st = aiStatus();
    const models = [["claude-opus-5-5", "Claude Opus 5.5 (best quality)"], ["claude-sonnet-5-5", "Claude Sonnet 5.5 (faster)"], ["claude-haiku-5-5", "Claude Haiku 5.5 (fastest, cheapest)"]];

      <section class="panel" aria-labelledby="aiTitle">
        <h2 id="aiTitle" style="font-size:1.3rem">Live AI</h2>
        <p>${esc(st.text)}</p>
        ${st.mode === "claude" ? "" : `
        ${st.mode === "site" ? `<p class="small muted">Optional: use your own Anthropic API key instead of the site's shared allowance.</p>` : ""}
        <div class="field"><label class="field-label" for="apiKey">Anthropic API key</label>
          <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(S.keyDraft ? S.keyDraft.apiKey : settings.apiKey)}"></div>
        <div class="field"><label class="field-label" for="modelSelect">Model</label><select id="modelSelect">${models.map(([id, l]) => `<option value="${id}" ${(S.keyDraft ? S.keyDraft.model : settings.model) === id ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
        <label class="toggle"><input type="checkbox" id="rememberKey" ${(S.keyDraft ? S.keyDraft.remember : settings.rememberKey) ? "checked" : ""}> Remember the key on this device</label>
        <p class="small muted">The key goes only from this browser to api.anthropic.com. Without “remember”, it is forgotten when you close the page. Don't save a key on a shared computer.</p>
        <div class="actions"><button type="button" class="btn primary small" data-action="saveKey">Save</button><button type="button" class="btn ghost small" data-action="forgetKey">Forget key</button></div>
        ${S.settingsMsg ? `<p class="small" role="status">${esc(S.settingsMsg)}</p>` : ""}`}
      </section>
      <section class="panel" aria-labelledby="testTitle">
        <h2 id="testTitle" style="font-size:1.3rem">Testing tools</h2>
        <div class="field"><label class="field-label" for="faultSelect">Simulate AI problems</label>
          <select id="faultSelect" data-change="fault">
            <option value="off" ${settings.fault === "off" ? "selected" : ""}>Off (normal)</option>
            <option value="once" ${settings.fault === "once" ? "selected" : ""}>First reply is broken (Bridge should retry and recover)</option>
            <option value="always" ${settings.fault === "always" ? "selected" : ""}>Every reply is broken (Bridge should show a friendly error)</option>
            <option value="site-down" ${settings.fault === "site-down" ? "selected" : ""}>Site AI is unavailable (saved demo still works)</option>
            <option value="site-rate" ${settings.fault === "site-rate" ? "selected" : ""}>Network hourly limit reached (saved demo still works)</option>
            <option value="site-daily" ${settings.fault === "site-daily" ? "selected" : ""}>Shared daily limit reached (saved demo still works)</option>
          </select></div>
        <div class="field"><span class="field-label">Shift the clock to test spaced review</span>
          <p class="small muted">Current shift: ${Number(settings.clockOffsetDays) || 0} day(s). Reviews come due 1, 3 and 7 days after a session.</p>
          <div class="actions"><button type="button" class="btn secondary small" data-action="clock" data-days="1">+1 day</button><button type="button" class="btn secondary small" data-action="clock" data-days="3">+3 days</button><button type="button" class="btn ghost small" data-action="clock" data-days="0">Reset clock</button></div></div>
      </section>
      <section class="panel"><h2 style="font-size:1.3rem">Data</h2><p class="small muted">See and export everything logged on this device.</p><div class="actions"><button type="button" class="btn secondary small" data-action="admin">Open the evidence log</button></div></section>`;
  };

  // ---------- Example class data for the teacher view (clearly marked) ----------
  function exampleSessions() {
    const la = DEMO.gaps.prerequisites;
    const st = [
      { term: "i.i.d. (independent and identically distributed)", type: "concept", importance: 5, why: "The passage assumes the observations X₁, …, Xₙ are i.i.d. before using the standard error formula." },
      { term: "standard deviation", type: "concept", importance: 5, why: "The standard error σ/√n is built from the standard deviation σ." },
      { term: "respectively", type: "language", importance: 4, why: "“X̄ and s denote … respectively” pairs each symbol with its meaning in order." },
      { term: "sampling distribution", type: "concept", importance: 4, why: "The Central Limit Theorem statement is about the sampling distribution of X̄." },
      { term: "denote", type: "language", importance: 3, why: "“Let X̄ and s denote …” introduces names for quantities." },
    ];
    const plan = [
      { p: "la", res: [0, 0, 0], mini: 1, help: 5, found: "yes", lang: "zh", t: 540, d: 6 },
      { p: "la", res: [0, 1, 0], mini: 2, help: 4, found: "yes", lang: "es", t: 610, d: 5 },
      { p: "la", res: [1, 1, 1], mini: 3, help: 3, found: "no", lang: "en", t: 300, d: 5 },
      { p: "la", res: [0, 0, 1], mini: 2, help: 5, found: "yes", lang: "zh", t: 720, d: 3 },
      { p: "la", res: [0, 1, 0], mini: 1, help: 4, found: "yes", lang: "en", t: 480, d: 2 },
      { p: "st", res: [0, 1, 0], mini: 2, help: 4, found: "yes", lang: "zh", t: 590, d: 2 },
      { p: "st", res: [0, 0, 0], mini: 1, help: 5, found: "yes", lang: "es", t: 660, d: 1 },
    ];
    return plan.map((x, i) => {
      const isLA = x.p === "la";
      const pre = isLA ? la.map((p) => ({ term: p.term, type: p.type, importance: p.importance, why: p.why_needed })) : st;
      const passage = isLA ? DEMO_PASSAGE : STATS_EXAMPLE;
      const started = now() - x.d * DAY_MS - (i + 1) * 3600 * 1000;
      const diagnostics = pre.slice(0, 3).map((p, k) => ({ term: p.term, type: p.type, why_needed: p.why, correct: !!x.res[k], unsure: false }));
      const missed = diagnostics.filter((d) => !d.correct).length;
      return {
        id: "EX-" + String(i + 1).padStart(2, "0"), schema_version: 1, example_data: true,
        started_at: iso(started), updated_at: iso(started + x.t * 1000), completed_at: iso(started + x.t * 1000), completed: true,
        source: isLA ? "demo" : "pasted", ai_mode: "example", course: isLA ? "linear-algebra" : "statistics", home_language: x.lang,
        passage_id: hashText(passage), passage_label: passageLabel(passage), passage_chars: passage.length, looks_like_homework: false,
        prerequisites: pre.map(({ term, type, importance }) => ({ term, type, importance, unsure: false })),
        n_prerequisites: pre.length, n_concept: pre.filter((p) => p.type === "concept").length, n_language: pre.filter((p) => p.type === "language").length,
        diagnostics, diagnostics_missed: missed, bridge_skipped: missed === 0,
        bridged_terms: diagnostics.filter((d) => !d.correct).map((d) => d.term), on_demand_bridges: [],
        minicheck: ["easy", "medium", "hard"].map((d, k) => ({ difficulty: d, correct: k < x.mini })),
        minicheck_score: x.mini, minicheck_total: 3, reviews_scheduled: missed + (3 - x.mini), time_spent_sec: x.t,
        survey: { skipped: false, helpful: x.help, found_new: x.found, still_confusing: "" }, ai_retries: 0, ai_errors: 0,
      };
    });
  }

  // ---------- Export ----------
  const CSV_COLUMNS = [
    "session_id", "started_at", "completed_at", "completed", "example_data", "source", "ai_mode", "course", "home_language",
    "passage_id", "passage_label", "looks_like_homework", "n_prerequisites", "n_concept", "n_language", "prerequisites",
    "diagnostics_n", "diagnostics_missed", "diagnostic_results", "bridge_skipped", "bridged_terms", "on_demand_bridges",
    "minicheck_score", "minicheck_total", "minicheck_results", "reviews_scheduled", "time_spent_sec",
    "survey_helpful", "survey_found_new", "survey_still_confusing", "survey_skipped", "ai_retries", "ai_errors", "mcq_quality_flags",
    "recheck_status", "recheck_correct", "recheck_total", "recheck_results", "prerequisite_pre_post",
  ];
  function csvCell(v) {
    if (v === null || v === undefined) return "";
    let s = typeof v === "string" ? v : String(v);
    if (typeof v === "string" && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // keep spreadsheets from running free text as formulas
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  const toCSV = (header, rows) => [header.join(","), ...rows.map((r) => r.map(csvCell).join(","))].join("\r\n") + "\r\n";
  function sessionsCSV(list) {
    return toCSV(CSV_COLUMNS, list.map((s) => {
      const sv = s.survey || {};
      return [
        s.id, s.started_at, s.completed_at, !!s.completed, !!s.example_data, s.source, s.ai_mode, s.course, s.home_language,
        s.passage_id, s.passage_label, !!s.looks_like_homework, s.n_prerequisites, s.n_concept, s.n_language,
        (s.prerequisites || []).map((p) => `${p.term} [${p.type}, ${p.importance}]`).join("; "),
        (s.diagnostics || []).length, s.diagnostics_missed,
        (s.diagnostics || []).map((d) => `${d.term}=${d.correct ? "correct" : d.unsure ? "not sure" : "missed"}`).join("; "),
        !!s.bridge_skipped, (s.bridged_terms || []).join("; "), (s.on_demand_bridges || []).join("; "),

      announceFeedback();
    },
    reviewNext: () => { S.review.answered = null; S.focusPending = true; render(); },
    exportJSON: () => offerFile(`bridge-sessions-${stamp()}.json`, "application/json", sessionsJSON(exportList())),
    exportCSV: () => offerFile(`bridge-sessions-${stamp()}.csv`, "text/csv", sessionsCSV(exportList())),
    exportClassCSV: () => offerFile(`bridge-class-summary-${stamp()}.csv`, "text/csv", classCSV()),
    draftLesson: () => {
      const sessions = loadSessions().filter((s) => (s.diagnostics || []).length);
      const first = classSummary(sessions).missedTerms.find((e) => e.missed > 0);
      if (first) draftLesson(first);
    },
    addExamples: () => {
      const keep = loadSessions().filter((s) => !s.example_data);
      writeSessions(keep.concat(exampleSessions()));
      S.admin.includeExamples = S.view === "admin" ? true : S.admin.includeExamples;
      toast("Added 7 example sessions");
      render();
    },
    removeExamples: () => { writeSessions(loadSessions().filter((s) => !s.example_data)); toast("Example data removed"); render(); },
    clearAll: () => { S.admin.confirmClear = true; render(); },
    clearAllCancel: () => { S.admin.confirmClear = false; render(); },
    clearAllConfirmed: () => {
      S.run++;
      if (S.ctl) S.ctl.abort(); // in-flight requests must not write anything back
      S.session = null;
      Object.values(K).forEach((k) => store.remove(k));
      Object.assign(settings, DEFAULT_SETTINGS);
      S.admin.confirmClear = false; S.session = null; S.lastStudentView = "home";
      toast("All data on this device deleted");
      render();
    },
    saveKey: () => {
      const key = ($("#apiKey") || {}).value || "";
      settings.apiKey = key.trim();
      settings.model = ($("#modelSelect") || {}).value || settings.model;
      settings.rememberKey = !!($("#rememberKey") || {}).checked;
      saveSettings();
      S.settingsMsg = settings.apiKey ? `Saved. Bridge will use ${settings.model}${settings.rememberKey ? " and remember the key on this device" : " until you close this page"}.` : "No key entered.";
      updateAIStatus();
      render();
    },
    forgetKey: () => { const k = $("#apiKey"); if (k) k.value = ""; const r = $("#rememberKey"); if (r) r.checked = false; settings.apiKey = ""; settings.rememberKey = false; saveSettings(); S.settingsMsg = "Key removed."; render(); },
    faultOff: () => { settings.fault = "off"; saveSettings(); render(); },
    clock: (el) => {
      const d = Number(el.dataset.days);
      settings.clockOffsetDays = d === 0 ? 0 : (Number(settings.clockOffsetDays) || 0) + d;
      saveSettings();
      toast(d === 0 ? "Clock reset" : `Clock shifted +${d} day(s)`);
      render();
    },
    closeSheet: (el, ev) => {
      if (el.classList.contains("sheet-backdrop") && ev.target.closest("[data-sheet]")) return;
      closeSheet();
    },
    copySheet: () => {
      const ta = $("#sheetText");
      const done = () => toast("Copied");
      const fallback = () => { ta.focus(); ta.setSelectionRange(0, ta.value.length); toast("Text selected. Use your device's Copy command."); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
    },
  };

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]");
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (!fn) return;
    if (el.tagName === "A") ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    const kind = t.dataset ? t.dataset.change : null;
    if (kind === "course") S.courseId = t.value;
    else if (kind === "demo") S.demoId = t.value;
    else if (kind === "lang") { S.langId = t.value; document.querySelectorAll('[data-change="lang"]').forEach((el) => { if (el.tagName === "SELECT") el.value = t.value; else el.checked = el.value === t.value; }); }
    else if (kind === "gloss") { S.showGloss = t.checked; render(); }
    else if (kind === "includeExamples") { S.admin.includeExamples = t.checked; render(); }
    else if (kind === "fault") { settings.fault = t.value; saveSettings(); render(); }
    else if (t.name === "helpful") S.survey.helpful = Number(t.value);
    else if (t.name === "found_new") S.survey.found_new = t.value;
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "passageInput") {
      S.draft = t.value;
      const c = $("#charCount");
      if (c) { c.textContent = `${t.value.length.toLocaleString()} / ${MAX_PASSAGE.toLocaleString()}`; c.classList.toggle("over", t.value.length > MAX_PASSAGE); }
    } else if (t.id === "confusing") S.survey.text = t.value;
  });
  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.id === "inputForm") {
      const text = (S.draft || "").trim();
      if (text.length < 40) { S.homeError = "Paste a bit more text: at least one full sentence from your reading."; render(); return; }
      if (text.length > MAX_PASSAGE) { S.homeError = `This is too long for one pass. Paste a shorter section (under ${MAX_PASSAGE.toLocaleString()} characters).`; render(); return; }
      if (aiStatus().mode === "none") { S.homeError = aiStatus().text; render(); return; }
      startSession({ passage: text, demo: false });
    } else if (ev.target.id === "surveyForm") {
      submitSurvey(false);
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet();
  });

  function routeFromHash() {
    const h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h === "teacher") go("teacher");
    else if (h === "admin" || h === "evidence") go("admin");
  }
  window.addEventListener("hashchange", routeFromHash);

  // ---------- Boot ----------
  applyTheme(theme, false);
  if (SITE_AI) {
    // Ask the site's AI server once whether it is set up, so the start page doesn't promise live AI it can't give.
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 8000);
    fetch(SITE_AI + "/health", { signal: ctl.signal })
      .then((r) => r.json())
      .then((j) => { if (!j || j.configured === false) { siteBlocked = true; updateAIStatus(); } })
      .catch(() => { /* unreachable now; a real request will explain if it still fails */ });
  }
  render();
  routeFromHash();
  getSample().then(updateAIStatus);
  getDownloads();

  // Test hooks for scripted checks; they only read state or call the same functions the buttons call.
  window.BridgeTest = {
    demos: () => clone(DEMOS),
    sessions: loadSessions,
    reviews: loadReviews,
    exportJSON: () => sessionsJSON(loadSessions()),
    exportCSV: () => sessionsCSV(loadSessions()),
    classCSV,
    state: () => S,
    parseLooseJSON,
    validators: { validateGaps, validateDiagnostic, validateRecheck, validateBridge, validateMiniCheck, validateLesson },
    prompts: { promptDetectGaps, promptDiagnostic, promptRecheck, promptBridge, promptMiniCheck, promptLesson },
    schema: SCHEMA,
  };
})();
</script>

</body>
</html>
